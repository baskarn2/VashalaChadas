{% set active_page = "text" -%}
{% include "header.html" %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-11">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data" action="{{ url_for('identify_from_text') }}">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label for="input_text" class="h5 font-weight-bold text-dark mb-0">
                                <i class="fas fa-keyboard mr-2 text-primary"></i>Enter Sanskrit Text:
                            </label>
                            {% include "output_scheme_selector.html" %}
                        </div>
                        
                        <div class="form-group">
                            <textarea class="form-control sanskrit-text shadow-sm" rows="5" id="input_text" name="input_text" placeholder="Type or paste Sanskrit text here (Devanagari, IAST, ITRANS, SLP1, etc.)...">{% if 'text' in data %}{{data.text}}{% endif %}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center flex-wrap">
                            {% include "text_mode_selector.html" %}
                            <div>
                                <button type="button" class="btn btn-outline-secondary mr-2" id="clear-text-btn">
                                    <i class="fas fa-eraser mr-1"></i> Clear
                                </button>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="fas fa-search mr-1"></i> Identify Meter
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            {% include "result.html" %}
        </div>
    </div>
</div>

<script>
    $('#clear-text-btn').click(function() {
        $('#input_text').val('').focus();
    });
</script>

{% include "footer.html" %}
