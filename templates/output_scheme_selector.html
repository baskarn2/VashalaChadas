<div class="form-group my-1 float-right">
    <label for="output_scheme" class="mr-2 font-weight-bold text-muted small text-uppercase">Output Scheme:</label>
    <select name="output_scheme" id="output_scheme" class="custom-select custom-select-sm d-inline-block w-auto">
        {% for scheme_name, scheme_display_name in available_schemes %}
        <option value="{{scheme_name}}" {% if data.output_scheme == scheme_name %}selected{% endif %}>
            {{scheme_display_name}}
        </option>
        {% endfor %}
    </select>
</div>
