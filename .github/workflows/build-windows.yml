name: Build Windows Application

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build Standalone App with PyInstaller
        run: |
          pyinstaller Vishalavrttavalih.spec

      - name: Package Windows ZIP Distribution
        shell: pwsh
        run: |
          Copy-Item README.md dist\Vishalavrttavalih\
          Copy-Item cleanup_uninstall.bat dist\Vishalavrttavalih\
          Compress-Archive -Path dist\Vishalavrttavalih\* -DestinationPath dist\Vishalavrttavalih-Windows-x64.zip -Force
          Get-Item dist\Vishalavrttavalih-Windows-x64.zip | Select-Object Name, Length

      - name: Upload Build Artifact (Available in Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: Vishalavrttavalih-Windows-x64
          path: dist/Vishalavrttavalih-Windows-x64.zip
          retention-days: 30

      - name: Create Release and Upload Asset (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vishalavrttavalih-Windows-x64.zip
          generate_release_notes: true
